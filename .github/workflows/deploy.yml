name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: lernquest-schwaiger

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (production only)
        run: npm ci --omit=dev

      - name: Syntax check
        run: |
          node --check server/index.js
          node --check public/app.js

      - name: Package
        run: zip -r -q deploy.zip server public node_modules package.json package-lock.json

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: deploy.zip

      - name: Health check
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "https://${AZURE_WEBAPP_NAME}.azurewebsites.net/healthz"; then exit 0; fi
            sleep 10
          done
          exit 1
